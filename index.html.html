<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Klapay族語練習 - 賽考利克泰雅語</title>
  <style>
    :root {
      --primary: #9e2a2b;
      --primary-dark: #670d10;
      --primary-light: #c14446;
      --accent: #d4a373;
      --bg: #f8f6f0;
      --card-bg: #ffffff;
      --text: #2b2b2b;
      --border: #e0dacf;
      --correct: #2e7d32;
      --wrong: #c62828;
      --shadow: 0 4px 14px rgba(0,0,0,0.08);
      --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 12px; min-height: 100vh; }
    .container { max-width: 900px; margin: 0 auto; }

    /* Header */
    header {
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      color: white;
      padding: 16px 20px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 14px;
      position: relative;
      overflow: hidden;
    }
    header::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; height: 5px;
      background: repeating-linear-gradient(45deg, #fff, #fff 10px, var(--accent) 10px, var(--accent) 20px, var(--primary-dark) 20px, var(--primary-dark) 30px);
    }
    .header-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    header h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: 1px; }
    .badge { background: rgba(255,255,255,0.22); font-size: 0.85rem; padding: 4px 10px; border-radius: 20px; }
    .sub-title { font-size: 0.85rem; opacity: 0.9; margin-top: 4px; }

    /* Control Panel */
    .panel {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 14px 18px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
    }
    .filter-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }
    @media (max-width: 600px) {
      .filter-grid { grid-template-columns: 1fr; }
    }
    label { font-size: 0.85rem; font-weight: 700; color: #555; display: block; margin-bottom: 4px; }
    select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      font-size: 0.95rem;
      background: #fff;
      color: var(--text);
      outline: none;
    }
    select:focus { border-color: var(--primary); }

    /* Mode Navigation Tabs */
    .mode-nav {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    @media (max-width: 640px) {
      .mode-nav { grid-template-columns: 1fr 1fr; }
    }
    .tab-btn {
      padding: 10px 8px;
      border: 1.5px solid transparent;
      border-radius: 8px;
      background: #eee8de;
      color: #444;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .tab-btn:hover { background: #dfd7ca; }
    .tab-btn.active {
      background: var(--primary);
      color: white;
      box-shadow: 0 3px 8px rgba(158, 42, 43, 0.35);
    }

    /* Common Card Area */
    .content-box {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
      min-height: 440px;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      margin-bottom: 16px;
      border-bottom: 2px solid var(--border);
      flex-wrap: wrap;
      gap: 10px;
      font-size: 0.95rem;
    }
    .status-badge {
      background: #f1ebd9;
      color: #6a4a1f;
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.85rem;
    }
    .action-btn-small {
      background: var(--primary);
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* MODE 1: 翻牌遊戲 */
    .flip-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }
    @media (max-width: 700px) {
      .flip-grid { grid-template-columns: repeat(4, 1fr); gap: 8px; }
    }
    @media (max-width: 450px) {
      .flip-grid { grid-template-columns: repeat(3, 1fr); gap: 6px; }
    }
    .card-slot {
      aspect-ratio: 1;
      perspective: 800px;
      cursor: pointer;
    }
    .flip-inner {
      width: 100%; height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.35s ease;
      border-radius: 10px;
    }
    .card-slot.flipped .flip-inner { transform: rotateY(180deg); }
    .card-slot.matched .flip-inner { transform: rotateY(180deg); opacity: 0.35; pointer-events: none; }
    .face {
      position: absolute; width: 100%; height: 100%;
      backface-visibility: hidden;
      border-radius: 10px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 6px; text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      user-select: none;
    }
    .face-front {
      background: linear-gradient(135deg, #7f2224, var(--primary));
      color: white;
      font-size: 1.3rem;
      font-weight: 800;
      border: 2px solid white;
    }
    .face-front::after {
      content: "◆";
      font-size: 0.9rem;
      opacity: 0.6;
      margin-top: 2px;
    }
    .face-back {
      background: white;
      border: 2px solid var(--accent);
      transform: rotateY(180deg);
    }
    .tag-pill {
      font-size: 0.65rem;
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .tag-at { background: #e3f2fd; color: #1565c0; }
    .tag-zh { background: #fbe9e7; color: #d84315; }
    .card-term {
      font-size: 0.95rem;
      font-weight: 800;
      line-height: 1.25;
      word-break: break-word;
    }

    /* MODE 2 & 3: 選擇題 */
    .quiz-area { max-width: 620px; margin: 0 auto; text-align: center; padding: 10px 0; }
    .quiz-topic {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      background: #f0e9dd;
      font-size: 0.85rem;
      color: #6d5b45;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .quiz-prompt { font-size: 0.95rem; color: #666; margin-bottom: 8px; }
    .quiz-word {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--primary);
      margin: 10px 0 14px;
      min-height: 52px;
      word-break: break-word;
    }
    .quiz-hint {
      font-size: 0.88rem;
      color: #777;
      min-height: 20px;
      margin-bottom: 18px;
    }
    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }
    .opt-btn {
      padding: 15px 18px;
      border-radius: 12px;
      border: 2px solid var(--border);
      background: #fbfaf7;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      color: #333;
      text-align: center;
    }
    .opt-btn:hover:not(:disabled) {
      background: #f0eae1;
      border-color: #c9bea9;
    }
    .opt-btn.correct {
      background: #e8f5e9 !important;
      border-color: var(--correct) !important;
      color: var(--correct) !important;
    }
    .opt-btn.wrong {
      background: #ffebee !important;
      border-color: var(--wrong) !important;
      color: var(--wrong) !important;
    }
    .btn-next {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 30px;
      font-size: 1.05rem;
      font-weight: 800;
      border-radius: 8px;
      cursor: pointer;
      display: none;
      box-shadow: 0 3px 10px rgba(158,42,43,0.3);
    }

    /* MODE 4: 自測卡片 */
    .flash-container { max-width: 520px; margin: 10px auto 0; }
    .flashcard-box {
      height: 300px;
      perspective: 1000px;
      cursor: pointer;
      margin-bottom: 18px;
    }
    .flashcard-inner {
      width: 100%; height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(0.2, 0.85, 0.4, 1.2);
      border-radius: 16px;
      box-shadow: 0 8px 22px rgba(0,0,0,0.1);
    }
    .flashcard-box.flipped .flashcard-inner { transform: rotateY(180deg); }
    .fc-face {
      position: absolute; width: 100%; height: 100%;
      backface-visibility: hidden;
      border-radius: 16px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 24px; text-align: center;
      box-sizing: border-box;
    }
    .fc-front {
      background: white;
      border: 3px solid var(--primary);
    }
    .fc-back {
      background: linear-gradient(135deg, var(--primary-dark), #8b263e);
      color: white;
      transform: rotateY(180deg);
    }
    .fc-tip { font-size: 0.85rem; color: #888; margin-bottom: 12px; }
    .fc-back .fc-tip { color: #f2c9d8; }
    .fc-main-term { font-size: 2.3rem; font-weight: 800; margin-bottom: 8px; word-break: break-word; }
    .fc-sub-term { font-size: 1rem; color: #666; }
    .fc-back .fc-sub-term { color: #f5e4ea; }
    .fc-controls {
      display: flex;
      gap: 10px;
      justify-content: space-between;
    }
    .fc-btn {
      flex: 1;
      padding: 12px;
      background: #555;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }
    .fc-btn.primary { background: var(--primary); }

    /* Results summary */
    .summary-card {
      text-align: center;
      padding: 40px 20px;
    }
    .summary-card h2 { font-size: 1.8rem; color: var(--primary); margin-bottom: 12px; }
    .score-banner {
      font-size: 3rem;
      font-weight: 900;
      color: var(--primary-dark);
      margin: 15px 0 25px;
    }
    .replay-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px 32px;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(158,42,43,0.3);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <div>
        <h1>Klapay 族語練習</h1>
        <div class="sub-title">賽考利克泰雅語 (Squliq Atayal) 單詞學習測驗 (主題 01~10，序號 1~401)</div>
      </div>
      <div class="badge">每次隨機 10 題</div>
    </div>
  </header>

  <div class="panel">
    <div class="filter-grid">
      <div>
        <label>選擇學習主題：</label>
        <select id="catSelect" onchange="onFilterChange()">
          <option value="ALL">全部主題 (01~10，共 401 詞)</option>
        </select>
      </div>
      <div>
        <label>級別範圍：</label>
        <select id="levelSelect" onchange="onFilterChange()">
          <option value="ALL">全部級別</option>
          <option value="初級">初級</option>
          <option value="中級">中級</option>
          <option value="中高級">中高級</option>
          <option value="高級">高級</option>
        </select>
      </div>
    </div>

    <div class="mode-nav">
      <button class="tab-btn active" id="tab-0" onclick="switchMode(0)">🃏 翻牌配對 (10題)</button>
      <button class="tab-btn" id="tab-1" onclick="switchMode(1)">🗣️ 看族語說中文 (10題)</button>
      <button class="tab-btn" id="tab-2" onclick="switchMode(2)">🔤 看中文說族語 (10題)</button>
      <button class="tab-btn" id="tab-3" onclick="switchMode(3)">📖 朗讀翻面自測 (10題)</button>
    </div>
  </div>

  <div class="content-box">
    <!-- 模式 1: 翻牌練習 -->
    <div id="mode-flip">
      <div class="status-bar">
        <div>
          <span>已配對：<b id="flip-matches" style="color:var(--primary);">0</b> / 10 題</span>
          <span style="margin-left: 14px;">翻牌次數：<b id="flip-clicks">0</b></span>
        </div>
        <div>
          <button class="action-btn-small" onclick="initFlipGame()">🔄 換一組 (隨機10題)</button>
        </div>
      </div>
      <div id="flip-grid" class="flip-grid"></div>
      <div id="flip-end" class="summary-card hidden">
        <h2>🎉 恭喜全部配對完成！</h2>
        <p style="font-size:1.1rem; color:#555; margin-bottom:20px;">總翻牌次數：<b id="flip-final-clicks" style="color:var(--primary);">0</b> 次</p>
        <button class="replay-btn" onclick="initFlipGame()">再玩一次 (隨機10題)</button>
      </div>
    </div>

    <!-- 模式 2 & 3: 選擇題 -->
    <div id="mode-quiz" class="hidden">
      <div class="status-bar">
        <div>
          <span>進度：<b id="quiz-num" style="color:var(--primary);">1</b> / 10 題</span>
          <span style="margin-left: 14px;">目前得分：<b id="quiz-score" style="color:var(--correct);">0</b> 分</span>
        </div>
        <div>
          <button class="action-btn-small" onclick="startQuiz()">🔄 重新隨機出題</button>
        </div>
      </div>
      
      <div id="quiz-ongoing" class="quiz-area">
        <div id="quiz-prompt-text" class="quiz-prompt">題目提示</div>
        <div id="quiz-question" class="quiz-word">--</div>
        <div id="quiz-options" class="options-grid"></div>
        <button id="btn-next-question" class="btn-next" onclick="nextQuestion()">下一題 ➔</button>
      </div>

      <div id="quiz-result" class="summary-card hidden">
        <h2>🎉 測驗完成！</h2>
        <div class="score-banner" id="quiz-final-score">100 分</div>
        <p style="color:#666; margin-bottom:24px;">每次隨機出 10 題，多加練習可以更加熟悉賽考利克泰雅語喔！</p>
        <button class="replay-btn" onclick="startQuiz()">再測一次 (隨機10題)</button>
      </div>
    </div>

    <!-- 模式 4: 朗讀翻面自測 -->
    <div id="mode-flash" class="hidden">
      <div class="status-bar">
        <div>
          <span>單詞：<b id="flash-num" style="color:var(--primary);">1</b> / 10 題</span>
          <span class="status-badge" style="margin-left:10px;">點擊卡片可翻面看答案</span>
        </div>
        <div>
          <button class="action-btn-small" onclick="initFlashcards()">🔄 換一組 (隨機10題)</button>
        </div>
      </div>

      <div class="flash-container">
        <div class="flashcard-box" id="flashcard-box" onclick="toggleFlashcard()">
          <div class="flashcard-inner">
            <div class="fc-face fc-front">
              <div class="fc-tip" id="fc-front-tip">【看族語 ‧ 請試念並說出中文】</div>
              <div class="fc-main-term" id="fc-front-word">qutux</div>
            </div>
            <div class="fc-face fc-back">
              <div class="fc-tip" id="fc-back-tip">【中文涵義】</div>
              <div class="fc-main-term" id="fc-back-word">一</div>
            </div>
          </div>
        </div>
        <div class="fc-controls">
          <button class="fc-btn" onclick="prevFlash()">◀ 上一題</button>
          <button class="fc-btn primary" onclick="toggleFlashPrompt()" id="btn-fc-toggle">切換：看族語說中文</button>
          <button class="fc-btn" onclick="nextFlash()">下一題 ▶</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>

: 386, "code": "10-07", "cat": "10山川地理", "zh": "河流", "at": "llyung", "rmk": "lyung", "lvl": "中級"}, {"id": 387, "code": "10-08", "cat": "10山川地理", "zh": "湖泊", "at": "bsilung", "rmk": "langu水塘；積水處/bsilung湖泊/pitung池塘/lubung水塘", "lvl": "中高級"}, {"id": 388, "code": "10-09", "cat": "10山川地理", "zh": "森林", "at": "hlahuy", "rmk": "", "lvl": "中級"}, {"id": 389, "code": "10-10", "cat": "10山川地理", "zh": "縫隙", "at": "gasuq", "rmk": "ngahaw/ngisoq/ngsuq", "lvl": "中級"}, {"id": 390, "code": "10-11", "cat": "10山川地理", "zh": "洞穴", "at": "bling", "rmk": "", "lvl": "中級"}, {"id": 391, "code": "10-12", "cat": "10山川地理", "zh": "山腳下", "at": "klbing", "rmk": "", "lvl": "中高級"}, {"id": 392, "code": "10-13", "cat": "10山川地理", "zh": "土堆", "at": "ʼntwan uraw", "rmk": "’ntwan", "lvl": "中高級"}, {"id": 393, "code": "10-14", "cat": "10山川地理", "zh": "岩洞", "at": "lxyux", "rmk": "", "lvl": "高級"}, {"id": 394, "code": "10-15", "cat": "10山川地理", "zh": "草原", "at": "m’ma k’man", "rmk": "mema’/m’ma’ kima/qnahi k’man", "lvl": "高級"}, {"id": 395, "code": "10-16", "cat": "10山川地理", "zh": "溫泉", "at": "ulay", "rmk": "tngtung", "lvl": "高級"}, {"id": 396, "code": "10-17", "cat": "10山川地理", "zh": "峽谷", "at": "uruw rgyax", "rmk": "", "lvl": "高級"}, {"id": 397, "code": "10-18", "cat": "10山川地理", "zh": "山洞", "at": "bling", "rmk": "", "lvl": "高級"}, {"id": 398, "code": "10-19", "cat": "10山川地理", "zh": "岩石", "at": "btunux", "rmk": "", "lvl": "高級"}, {"id": 399, "code": "10-20", "cat": "10山川地理", "zh": "瀑布", "at": "tgliq", "rmk": "", "lvl": "中高級"}, {"id": 400, "code": "10-21", "cat": "10山川地理", "zh": "獨立的小山頭", "at": "tbuci na b’bu", "rmk": "qutux hlahuy bbu rgyax/ tbuci’ ru cikuy b’bu’ na rgyax/bu’ rgyax", "lvl": "高級"}, {"id": 401, "code": "10-22", "cat": "10山川地理", "zh": "崇山峻嶺", "at": "rgrgyax", "rmk": "nergyax", "lvl": "高級"}];

let activeMode = 0; // 0: 翻牌, 1: 看族語說中文, 2: 看中文說族語, 3: 朗讀自測
let filteredPool = [];

// MODE 1 翻牌狀態
let flipCards = [];
let flippedIndices = [];
let matchedCount = 0;
let flipClicks = 0;
let flipLock = false;

// MODE 2 & 3 測驗狀態
let quizQuestions = [];
let quizIdx = 0;
let quizScore = 0;

// MODE 4 自測狀態
let flashQuestions = [];
let flashIdx = 0;
let flashAtFirst = true; // true: 看族語說中文, false: 看中文說族語

// 初始化選單
function initApp() {
  const cats = Array.from(new Set(VOCAB_DATA.map(d => d.cat)));
  const select = document.getElementById('catSelect');
  cats.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c;
    opt.textContent = c;
    select.appendChild(opt);
  });
  onFilterChange();
}

function onFilterChange() {
  const cat = document.getElementById('catSelect').value;
  const lvl = document.getElementById('levelSelect').value;

  filteredPool = VOCAB_DATA.filter(item => {
    const mCat = (cat === 'ALL' || item.cat === cat);
    const mLvl = (lvl === 'ALL' || item.lvl === lvl);
    return mCat && mLvl;
  });

  if (filteredPool.length < 4) {
    alert('此篩選條件下的單詞量不足 4 個，已重設為全部級別。');
    document.getElementById('levelSelect').value = 'ALL';
    filteredPool = VOCAB_DATA.filter(item => (cat === 'ALL' || item.cat === cat));
  }

  // 重新依當前模式啟動遊戲
  switchMode(activeMode);
}

function switchMode(modeIndex) {
  activeMode = modeIndex;
  for (let i = 0; i < 4; i++) {
    document.getElementById(`tab-${i}`).classList.toggle('active', i === modeIndex);
  }

  document.getElementById('mode-flip').classList.toggle('hidden', modeIndex !== 0);
  document.getElementById('mode-quiz').classList.toggle('hidden', modeIndex !== 1 && modeIndex !== 2);
  document.getElementById('mode-flash').classList.toggle('hidden', modeIndex !== 3);

  if (modeIndex === 0) {
    initFlipGame();
  } else if (modeIndex === 1 || modeIndex === 2) {
    startQuiz();
  } else if (modeIndex === 3) {
    initFlashcards();
  }
}

// 隨機選取 N 個題目工具函式
function getRandomQuestions(pool, count) {
  const shuffled = [...pool].sort(() => 0.5 - Math.random());
  return shuffled.slice(0, Math.min(count, shuffled.length));
}

/* =========================================================
   模式 1: 翻牌練習測驗 (隨機 10 題配對，共 20 張牌)
   ========================================================= */
function initFlipGame() {
  const grid = document.getElementById('flip-grid');
  grid.innerHTML = '';
  document.getElementById('flip-end').classList.add('hidden');
  grid.classList.remove('hidden');

  flippedIndices = [];
  matchedCount = 0;
  flipClicks = 0;
  flipLock = false;
  document.getElementById('flip-matches').innerText = '0';
  document.getElementById('flip-clicks').innerText = '0';

  // 隨機抽選 10 題
  const selected = getRandomQuestions(filteredPool, 10);
  let cards = [];
  selected.forEach(item => {
    cards.push({ id: item.id, type: 'at', text: item.at, code: item.code });
    cards.push({ id: item.id, type: 'zh', text: item.zh, code: item.code });
  });

  // 洗牌
  cards.sort(() => 0.5 - Math.random());
  flipCards = cards;

  cards.forEach((c, idx) => {
    const slot = document.createElement('div');
    slot.className = 'card-slot';
    slot.id = `flip-${idx}`;
    slot.innerHTML = `
      <div class="flip-inner">
        <div class="face face-front">?</div>
        <div class="face face-back">
          <span class="tag-pill ${c.type === 'at' ? 'tag-at' : 'tag-zh'}">${c.type === 'at' ? '族語' : '中文'}</span>
          <div class="card-term">${c.text}</div>
        </div>
      </div>
    `;
    slot.onclick = () => onCardClick(idx);
    grid.appendChild(slot);
  });
}

function onCardClick(idx) {
  if (flipLock) return;
  const slot = document.getElementById(`flip-${idx}`);
  if (slot.classList.contains('flipped') || slot.classList.contains('matched')) return;

  slot.classList.add('flipped');
  flippedIndices.push(idx);
  flipClicks++;
  document.getElementById('flip-clicks').innerText = flipClicks;

  if (flippedIndices.length === 2) {
    flipLock = true;
    const [i1, i2] = flippedIndices;
    const c1 = flipCards[i1];
    const c2 = flipCards[i2];

    const isMatch = (c1.id === c2.id && c1.type !== c2.type);
    if (isMatch) {
      setTimeout(() => {
        document.getElementById(`flip-${i1}`).classList.add('matched');
        document.getElementById(`flip-${i2}`).classList.add('matched');
        flippedIndices = [];
        flipLock = false;
        matchedCount++;
        document.getElementById('flip-matches').innerText = matchedCount;
        if (matchedCount === 10) {
          document.getElementById('flip-grid').classList.add('hidden');
          document.getElementById('flip-end').classList.remove('hidden');
          document.getElementById('flip-final-clicks').innerText = flipClicks;
        }
      }, 350);
    } else {
      setTimeout(() => {
        document.getElementById(`flip-${i1}`).classList.remove('flipped');
        document.getElementById(`flip-${i2}`).classList.remove('flipped');
        flippedIndices = [];
        flipLock = false;
      }, 850);
    }
  }
}

/* =========================================================
   模式 2 & 3: 選擇題測驗 (每次隨機 10 題，看族語說中文 / 看中文說族語)
   ========================================================= */
function startQuiz() {
  quizQuestions = getRandomQuestions(filteredPool, 10);
  quizIdx = 0;
  quizScore = 0;

  document.getElementById('quiz-ongoing').classList.remove('hidden');
  document.getElementById('quiz-result').classList.add('hidden');
  document.getElementById('quiz-score').innerText = '0';
  renderQuestion();
}

function renderQuestion() {
  if (quizIdx >= quizQuestions.length) {
    document.getElementById('quiz-ongoing').classList.add('hidden');
    document.getElementById('quiz-result').classList.remove('hidden');
    document.getElementById('quiz-final-score').innerText = `${quizScore} 分`;
    return;
  }

  document.getElementById('quiz-num').innerText = quizIdx + 1;
  document.getElementById('btn-next-question').style.display = 'none';

  const cur = quizQuestions[quizIdx];
  const isAt2Zh = (activeMode === 1);

  document.getElementById('quiz-prompt-text').innerText = isAt2Zh
    ? '【看泰雅族語】選出正確的中文含意：'
    : '【看中文】選出正確的泰雅族語：';
  document.getElementById('quiz-question').innerText = isAt2Zh ? cur.at : cur.zh;

  // 隨機選 3 個干擾項 (自全部 401 題中挑選不同詞)
  const distractors = VOCAB_DATA.filter(d => d.id !== cur.id)
    .sort(() => 0.5 - Math.random())
    .slice(0, 3);
  const choices = [...distractors, cur].sort(() => 0.5 - Math.random());

  const optContainer = document.getElementById('quiz-options');
  optContainer.innerHTML = '';
  choices.forEach(ch => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerText = isAt2Zh ? ch.zh : ch.at;
    btn.onclick = () => onAnswer(btn, ch.id === cur.id);
    optContainer.appendChild(btn);
  });
}

function onAnswer(clickedBtn, isCorrect) {
  const allBtns = document.querySelectorAll('.opt-btn');
  allBtns.forEach(b => b.disabled = true);

  const cur = quizQuestions[quizIdx];
  const isAt2Zh = (activeMode === 1);
  const correctText = isAt2Zh ? cur.zh : cur.at;

  if (isCorrect) {
    clickedBtn.classList.add('correct');
    quizScore += 10;
    document.getElementById('quiz-score').innerText = quizScore;
  } else {
    clickedBtn.classList.add('wrong');
    allBtns.forEach(b => {
      if (b.innerText === correctText) b.classList.add('correct');
    });
  }

  document.getElementById('btn-next-question').style.display = 'inline-block';
}

function nextQuestion() {
  quizIdx++;
  renderQuestion();
}

/* =========================================================
   模式 4: 朗讀翻面自測 (隨機 10 題，大字卡翻面)
   ========================================================= */
function initFlashcards() {
  flashQuestions = getRandomQuestions(filteredPool, 10);
  flashIdx = 0;
  updateFlashUI();
}

function toggleFlashcard() {
  document.getElementById('flashcard-box').classList.toggle('flipped');
}

function toggleFlashPrompt() {
  flashAtFirst = !flashAtFirst;
  document.getElementById('btn-fc-toggle').innerText = flashAtFirst ? '切換：看族語說中文' : '切換：看中文說族語';
  updateFlashUI();
}

function updateFlashUI() {
  document.getElementById('flashcard-box').classList.remove('flipped');
  if (flashQuestions.length === 0) return;

  const cur = flashQuestions[flashIdx];
  document.getElementById('flash-num').innerText = flashIdx + 1;

  if (flashAtFirst) {
    document.getElementById('fc-front-tip').innerText = '【看族語 ‧ 請發音並試念中文】';
    document.getElementById('fc-front-word').innerText = cur.at;

    document.getElementById('fc-back-tip').innerText = '【中文涵義】';
    document.getElementById('fc-back-word').innerText = cur.zh;
  } else {
    document.getElementById('fc-front-tip').innerText = '【看中文 ‧ 請口說發音出泰雅語】';
    document.getElementById('fc-front-word').innerText = cur.zh;

    document.getElementById('fc-back-tip').innerText = '【泰雅族語】';
    document.getElementById('fc-back-word').innerText = cur.at;
  }
}

function prevFlash() {
  if (flashQuestions.length === 0) return;
  flashIdx = (flashIdx - 1 + flashQuestions.length) % flashQuestions.length;
  updateFlashUI();
}

function nextFlash() {
  if (flashQuestions.length === 0) return;
  flashIdx = (flashIdx + 1) % flashQuestions.length;
  updateFlashUI();
}

// 頁面載入完成立即啟動
window.onload = initApp;
</script>
